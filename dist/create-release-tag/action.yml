name: Create Release Tag

description: Resolve the package version, create and push the corresponding Git release tag.

inputs:
  source:
    description: Source file used to resolve the package version.
    required: false
    default: package.json

outputs:
  version:
    description: Resolved package version.
    value: ${{ steps.publish.outputs.version }}
  
  major:
    description: Resolved major version.
    value: ${{ steps.publish.outputs.major }}

  tag:
    description: Resolved npm publish tag.
    value: ${{ steps.publish.outputs.tag }}
    
  release-tag:
    description: Created Git release tag.
    value: v${{ steps.publish.outputs.version }}

runs:
  using: composite

  steps:
    - name: Resolve publish version
      id: publish
      uses: yukiakai212/publish-tag@v1
      with:
        source: ${{ inputs.source }}

    - name: Configure Git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Create and push release tag
      shell: bash
      env:
        RELEASE_TAG: v${{ steps.publish.outputs.version  }}
      run: |
        git tag -f "${RELEASE_TAG}"
        git push origin -f "refs/tags/${RELEASE_TAG}"