name: Publish GitHub Action Release

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version.
        required: false
        default: '24'
        type: string

      package-directory:
        description: Repository-relative directory of the Node package.
        required: false
        default: '.'
        type: string

permissions:
  contents: write

concurrency:
  group: publish-action-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'branch' &&
      startsWith(github.event.head_commit.message, 'release:')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      # ----------------------------------------------------------------------
      # GitHub Actions use two tags:
      #
      #   vX.Y.Z  -> immutable release tag
      #   vX      -> moving major tag
      #
      # Both actions intentionally resolve the package version independently.
      # Although this duplicates metadata resolution, it keeps each composite
      # action completely self-contained and independently reusable.
      #
      # Create the immutable release tag first, then move its matching major
      # tag to that release.
      # ----------------------------------------------------------------------

      - name: Create release tag
        id: release
        uses: yukiakai212/actions-public/actions/create-release-tag@v1
        with:
          package-type: node
          package-directory: ${{ inputs.package-directory }}

      - name: Update major tag
        uses: yukiakai212/actions-public/actions/update-major-tag@v1
        with:
          major: ${{ steps.release.outputs.major }}
          release-tag: ${{ steps.release.outputs.release-tag }}
