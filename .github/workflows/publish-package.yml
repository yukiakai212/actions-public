name: Publish Npm Package

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version.
        required: false
        default: "24"
        type: string
        
      package-directory:
        description: Repository-relative directory of the Node package.
        required: false
        type: string
        default: "."

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'branch' &&
      startsWith(github.event.head_commit.message, 'release:')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org/

      - name: Verify package
        working-directory: ${{ inputs.package-directory }}
        run: npx packverify@latest validate --ignore-pack-scripts

      - name: Create release tag
        id: release
        uses: yukiakai212/actions-public/actions/create-release-tag@v1
        with:
          package-type: node
          package-directory: ${{ inputs.package-directory }}
      
      - name: Resolve npm dist-tag
        id: npm-tag
        env:
          NPM_TAG: >-
            ${{ github.ref_name == github.event.repository.default_branch &&
            'latest' || github.ref_name }}
        run: echo "tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
      
      - name: Publish to npm with provenance
        working-directory: ${{ inputs.package-directory }}
        run: npm publish --ignore-scripts --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}