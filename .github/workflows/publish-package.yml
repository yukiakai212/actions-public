name: Publish Npm Package

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version.
        required: false
        default: "24"
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'release:')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org/
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      - name: Verify package
        run: npx packverify validate

      - name: Create release tag
        id: release
        uses: yukiakai212/actions-public/dist/create-release-tag@v1
        with:
          source: package.json
          
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public --tag ${{ steps.release.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}