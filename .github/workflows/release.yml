name: Release

on:
  push:
    branches:
      - main

jobs:
  prepare-release-tag:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: yukiakai212/actions-public/dist/prepare-release-tag@v1
        with:
          source: package.json
  update-major-tag:
    needs: prepare-release-tag

    uses: yukiakai212/actions-public/.github/workflows/update-major-tag.yml@v1