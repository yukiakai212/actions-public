name: Update Major Tag

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: update-major-tag
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve publish version
        id: publish
        uses: yukiakai212/publish-tag@v1
        with:
          source: package.json

      - name: Update major tag
        shell: bash
        env:
          RELEASE_TAG: v${{ steps.publish.outputs.version }}
          MAJOR_TAG: v${{ steps.publish.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Updating ${MAJOR_TAG} -> ${RELEASE_TAG}"

          git tag -f "${MAJOR_TAG}" "${RELEASE_TAG}"
          git push origin -f "refs/tags/${MAJOR_TAG}"