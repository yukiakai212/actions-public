name: Create Release Tag

description: Resolve release metadata, create and push the corresponding Git release tag.

inputs:
  package-type:
    description: Package manifest type used to resolve the release version.
    required: false
    default: node

  package-directory:
    description: Repository-relative directory containing the package manifest.
    required: false
    default: "."

outputs:
  version:
    description: Resolved semantic version without build metadata.
    value: ${{ steps.metadata.outputs.version }}
  
  major:
    description: Major version of the created release tag.
    value: ${{ steps.metadata.outputs.major }}
    
  release-tag:
    description: Created Git release tag.
    value: ${{ steps.metadata.outputs.release-tag }}

runs:
  using: composite

  steps:
    - name: Resolve release metadata
      id: metadata
      uses: yukiakai212/resolve-release-metadata@v2
      with:
        package-type: ${{ inputs.package-type }}
        package-directory: ${{ inputs.package-directory }}

    - name: Configure Git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Create and push release tag
      shell: bash
      env:
        RELEASE_TAG: ${{ steps.metadata.outputs.release-tag }}
      run: |
        git tag -f "${RELEASE_TAG}"
        git push origin -f "refs/tags/${RELEASE_TAG}"